<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Akun - Luna-Inc</title>
    
    <link rel="stylesheet" href="style.css"> 
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* Desain Modern Khusus Halaman Daftar */
        .wadah-form {
            max-width: 400px;
            margin: 60px auto;
            background: rgba(255, 255, 255, 0.05); /* Efek Kaca */
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .wadah-form h2 {
            text-align: center;
            margin-top: 0;
            margin-bottom: 30px;
            /* Efek teks gradasi menyala */
            background: -webkit-linear-gradient(#ff416c, #ff4b2b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 32px;
        }

        .grup-input {
            margin-bottom: 20px;
        }

        .grup-input label {
            display: block;
            margin-bottom: 8px;
            color: #b3c0d1;
            font-size: 14px;
            font-weight: 600;
        }

        .grup-input input {
            width: 100%;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(0, 0, 0, 0.2);
            color: #ffffff;
            box-sizing: border-box;
            font-size: 14px;
            font-family: 'Poppins', sans-serif;
            outline: none;
            transition: all 0.3s ease;
        }

        /* Nyala warna merah/orange saat diketik */
        .grup-input input:focus {
            border-color: #ff4b2b;
            box-shadow: 0 0 15px rgba(255, 75, 43, 0.4);
            background: rgba(0, 0, 0, 0.4);
        }

        .btn-daftar-form {
            width: 100%;
            padding: 15px;
            background: linear-gradient(45deg, #ff416c, #ff4b2b);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.3s ease;
            font-family: 'Poppins', sans-serif;
        }

        .btn-daftar-form:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(255, 65, 108, 0.4);
        }

        .kembali {
            display: block;
            text-align: center;
            margin-top: 25px;
            color: #b3c0d1;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.3s;
        }

        .kembali:hover {
            color: #00f2fe;
        }

        #pesan-sukses, #pesan-error {
            display: none; 
            text-align: center;
            margin-top: 20px;
            font-weight: bold;
            padding: 15px;
            border-radius: 10px;
            font-size: 14px;
        }

        #pesan-sukses {
            background: rgba(0, 255, 136, 0.1);
            color: #00ff88;
            border: 1px solid #00ff88;
        }

        #pesan-error {
            background: rgba(255, 77, 77, 0.1);
            color: #ff4d4d;
            border: 1px solid #ff4d4d;
        }
    </style>
</head>
<body>

    <div class="wadah-form">
        <h2>Daftar Akun</h2>
        
        <form id="form-pendaftaran">
            <div class="grup-input">
                <label>Nama Pengguna</label>
                <input type="text" id="username" placeholder="Masukkan namamu..." required>
            </div>
            
            <div class="grup-input">
                <label>Alamat Email</label>
                <input type="email" id="email" placeholder="contoh@email.com" required>
            </div>
            
            <div class="grup-input">
                <label>Kata Sandi</label>
                <input type="password" id="password" placeholder="Buat kata sandi..." required>
            </div>
            
            <div class="grup-input">
                <label>Konfirmasi Sandi</label>
                <input type="password" id="confirm-password" placeholder="Ulangi kata sandi..." required>
            </div>
            
            <button type="submit" class="btn-daftar-form">Mulai Bermain 🚀</button>
            
            <div id="pesan-sukses">🎉 Pendaftaran berhasil! Membuka lobi...</div>
            <div id="pesan-error">⚠️ Kata sandi tidak cocok! Cek kembali.</div>
        </form>

        <a href="index.html" class="kembali">⬅ Kembali ke Beranda</a>
    </div>

    <script>
        const form = document.getElementById("form-pendaftaran");

        form.addEventListener("submit", function(event) {
            event.preventDefault(); 
            
            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;
            const confirmPassword = document.getElementById("confirm-password").value;
            
            const pesanSukses = document.getElementById("pesan-sukses");
            const pesanError = document.getElementById("pesan-error");
            
            if (password !== confirmPassword) {
                pesanError.style.display = "block";
                pesanSukses.style.display = "none";
            } else {
                pesanError.style.display = "none";
                pesanSukses.style.display = "block";
                
                // Simpan nama ke memori
                localStorage.setItem("namaPemain", username);
                
                // Pindah halaman otomatis
                setTimeout(function() {
                    window.location.href = "index.html";
                }, 2000);
            }
        });
    </script>
</body>
</html>
