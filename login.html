<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luna-Inc Game - Autentikasi</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-blue: #00f3ff;
            --neon-purple: #9d4edd;
            --dark-bg: #030712;
            --glass-bg: rgba(10, 15, 30, 0.7);
            --border-glow: rgba(0, 243, 255, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--dark-bg);
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(157, 78, 221, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(0, 243, 255, 0.15) 0%, transparent 40%);
            font-family: 'Poppins', sans-serif;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        /* Loading Overlay Screen */
        .loader-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(3, 7, 18, 0.95);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        .loader-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .neon-spinner {
            width: 60px;
            height: 60px;
            border: 4px solid transparent;
            border-top: 4px solid var(--neon-blue);
            border-bottom: 4px solid var(--neon-purple);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            filter: drop-shadow(0 0 10px var(--neon-blue));
            margin-bottom: 20px;
        }

        .loader-text {
            font-family: 'Orbitron', sans-serif;
            color: var(--neon-blue);
            letter-spacing: 2px;
            text-shadow: 0 0 8px var(--neon-blue);
            animation: pulse 1.5s infinite;
        }

        /* Container Utama */
        .auth-container {
            width: 100%;
            max-width: 420px;
            padding: 30px;
            margin: 20px;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-glow);
            border-radius: 24px;
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.1), inset 0 0 15px rgba(255, 255, 255, 0.05);
            position: relative;
            z-index: 10;
        }

        /* Header & Gaya Ketik Berulang-ulang */
        .brand-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .brand-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.8rem;
            font-weight: 700;
            color: #ffffff;
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.6);
            display: inline-block;
            min-height: 40px;
        }

        .brand-title::after {
            content: '|';
            color: var(--neon-blue);
            animation: blink 0.7s infinite;
        }

        .brand-subtitle {
            font-size: 0.85rem;
            color: #9ca3af;
            letter-spacing: 1px;
            margin-top: 5px;
        }

        /* Form Controls */
        .auth-form {
            display: none;
        }

        .auth-form.active {
            display: block;
            animation: fadeIn 0.5s ease forwards;
        }

        .form-group {
            margin-bottom: 20px;
            position: relative;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            color: var(--neon-blue);
            margin-bottom: 8px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .form-input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: white;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--neon-blue);
            background: rgba(0, 243, 255, 0.02);
            box-shadow: 0 0 12px rgba(0, 243, 255, 0.3);
        }

        /* Tombol Neon Glamour */
        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #00b4d8 0%, var(--neon-purple) 100%);
            border: none;
            border-radius: 12px;
            color: white;
            font-family: 'Orbitron', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(157, 78, 221, 0.4);
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 243, 255, 0.5);
            filter: brightness(1.1);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        /* Navigasi Pindah Form */
        .form-footer {
            text-align: center;
            margin-top: 25px;
            font-size: 0.85rem;
            color: #9ca3af;
        }

        .form-footer a {
            color: var(--neon-blue);
            text-decoration: none;
            font-weight: 600;
            margin-left: 5px;
            transition: text-shadow 0.3s ease;
        }

        .form-footer a:hover {
            text-shadow: 0 0 8px var(--neon-blue);
        }

        /* Animasi */
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; filter: drop-shadow(0 0 15px var(--neon-blue)); }
        }

        @keyframes blink {
            50% { opacity: 0; }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div id="loadingScreen" class="loader-overlay">
        <div class="neon-spinner"></div>
        <div id="loadingText" class="loader-text">Please Wait luna-inc...</div>
    </div>

    <div class="auth-container">
        <div class="brand-header">
            <h1 id="typewriter" class="brand-title"></h1>
            <p class="brand-subtitle">Hallo Silahkan Login</p>
        </div>

        <form id="loginForm" class="auth-form active" onsubmit="prosesLogin(event)">
            <div class="form-group">
                <label for="loginUser">Nama Pemain / ID</label>
                <input type="text" id="loginUser" class="form-input" placeholder="Masukkan ID Anda..." required>
            </div>
            <div class="form-group">
                <label for="loginPass">Konfirmasi Password</label>
                <input type="password" id="loginPass" class="form-input" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-submit">Login Sekarang</button>
            <div class="form-footer">
                Belum terdaftar? <a href="#" onclick="pindahForm('registerForm')">Buat Akun Baru</a>
            </div>
        </form>

        <form id="registerForm" class="auth-form" onsubmit="prosesDaftar(event)">
            <div class="form-group">
                <label for="regUser">Nama Pemain Baru</label>
                <input type="text" id="regUser" class="form-input" placeholder="Buat ID unik..." required>
            </div>
            <div class="form-group">
                <label for="regPass">Sandi</label>
                <input type="password" id="regPass" class="form-input" placeholder="Buat sandi rumit..." required>
            </div>
            <button type="submit" class="btn-submit">DAFTARKAN IDENTITAS</button>
            <div class="form-footer">
                Sudah memiliki akses? <a href="#" onclick="pindahForm('loginForm')">Kembali Log In</a>
            </div>
        </form>
    </div>

    <script>
        // --- Efek Mengetik Berulang-ulang (Typewriter Loop) ---
        const textKata = "Luna-Inc Game";
        let count = 0;
        let indexText = 0;
        let currentText = "";
        let isDeleting = false;
        const targetElement = document.getElementById("typewriter");

        function efekKetik() {
            if (isDeleting) {
                currentText = textKata.substring(0, currentText.length - 1);
            } else {
                currentText = textKata.substring(0, currentText.length + 1);
            }

            targetElement.innerText = currentText;

            let kecepatanKetik = 150;
            if (isDeleting) kecepatanKetik /= 2;

            if (!isDeleting && currentText === textKata) {
                kecepatanKetik = 2000; // Diam sebentar setelah selesai mengetik
                isDeleting = true;
            } else if (isDeleting && currentText === "") {
                isDeleting = false;
                kecepatanKetik = 500; // Jeda sebelum mengetik ulang
            }

            setTimeout(efekKetik, kecepatanKetik);
        }

        // Jalankan efek ketik saat halaman siap
        document.addEventListener("DOMContentLoaded", () => {
            efekKetik();
            // Logika deteksi parameter logout paksa dari index.html
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('action') === 'logout') {
                jalankanAnimasiLoading("MEMUTUSKAN JARINGAN...", () => {
                    // Bersihkan sisa parameter di url agar rapi
                    window.history.replaceState({}, document.title, window.location.pathname);
                });
            }
        });

        // --- Logika Navigasi Pindah Form ---
        function pindahForm(formId) {
            document.querySelectorAll('.auth-form').forEach(form => form.classList.remove('active'));
            document.getElementById(formId).classList.add('active');
        }

        // --- Fungsi Pembantu Animasi Loading ---
        function jalankanAnimasiLoading(teks, callback) {
            const overlay = document.getElementById("loadingScreen");
            const loadText = document.getElementById("loadingText");
            loadText.innerText = teks;
            
            overlay.classList.add("active");

            // Tahan animasi selama 1.8 detik agar transisi glamour terlihat nyata
            setTimeout(() => {
                overlay.classList.remove("active");
                if(callback) callback();
            }, 1800);
        }

        // --- Proses Form Kirim Data (Fake Logic) ---
        function prosesLogin(e) {
            e.preventDefault();
            const username = document.getElementById("loginUser").value;
            
            // Simpan nama pemain palsu ke localStorage
            localStorage.setItem("namaPemain", username);

            jalankanAnimasiLoading("Please Wait Luna Game...", () => {
                window.location.href = "index.html";
            });
        }

        function prosesDaftar(e) {
            e.preventDefault();
            const username = document.getElementById("regUser").value;

            jalankanAnimasiLoading("MENDAFTARKAN PENGGUNA...", () => {
                alert("Pendaftaran Berhasil! Silakan masuk menggunakan akun baru Anda.");
                pindahForm('loginForm');
                document.getElementById("loginUser").value = username;
            });
        }
    </script>
</body>
</html>
