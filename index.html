<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>☆☆ Luna-Inc Game ☆☆</title>
    
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* Style Tambahan untuk Efek Neon Glasses Subtitle */
        .neon-glass-text {
            font-family: 'Poppins', sans-serif;
            font-size: 1.1rem;
            font-weight: 600;
            letter-spacing: 1px;
            color: #ffffff;
            text-shadow: 
                0 0 5px rgba(0, 243, 255, 0.6),
                0 0 10px rgba(0, 243, 255, 0.4),
                0 0 20px rgba(0, 243, 255, 0.2);
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            padding: 10px 20px;
            border-radius: 12px;
            border: 1px solid rgba(0, 243, 255, 0.15);
            display: inline-block;
            box-shadow: 0 4px 15px rgba(0, 243, 255, 0.05);
            margin-bottom: 25px;
        }

        #typewriter-subtitle::after {
            content: '|';
            color: #00f3ff;
            margin-left: 2px;
            animation: kedipKursor 0.7s infinite;
        }

        @keyframes kedipKursor {
            50% { opacity: 0; }
        }
        
        /* CSS tambahan untuk merapikan tombol keluar jika diperlukan */
        #tombol-keluar {
            display: none;
        }
    </style>
</head>
<body>

    <header class="glass-header">
        <h1>Luna-Inc Game</h1>
        
        <div class="user-profile-neon">
    <p id="sapaan" class="sapaan-teks"></p>
    <button id="tombol-keluar" class="btn-keluar-neon" onclick="keluarAkun()">
        <span class="btn-icon">⚡</span> Logout
    </button>
</div>

    </header>

    <div class="main-content">
        <p class="subtitle neon-glass-text">
            <span id="typewriter-subtitle"></span>
        </p>
        
        <input type="text" id="kolom-cari" placeholder="🔍 Cari nama permainan..." class="search-bar">
        
        <div id="wadah-game" class="grid-container">
            </div>
    </div>

    <script src="script.js"></script>

    <script>
        // --- 1. Logika Cek Sesi Login ---
        const namaTersimpan = localStorage.getItem("namaPemain");
        const tombolKeluar = document.getElementById("tombol-keluar");
        
        if (namaTersimpan) {
            document.getElementById("sapaan").innerHTML = "👋 Selamat datang, " + namaTersimpan + "!";
            tombolKeluar.style.display = "block";
        } else {
            // Jika user iseng masuk tanpa login, tendang kembali ke pintu utama
            window.location.href = "login.html";
        }

        function keluarAkun() {
            localStorage.removeItem("namaPemain");
            // Mengarahkan ke halaman login dengan parameter khusus logout agar animasinya terpicu
            window.location.href = "login.html?action=logout";
        }

        // --- 2. Logika Efek Mengetik Subtitle (Perbaikan Rumus Baris 71) ---
        const teksSubtitle = "♡ hallo, saya Luna Aprilia ♡";
        let indeksKarakter = 0;
        let teksSekarang = "";
        let sedangMenghapus = false;
        const elemenSubtitle = document.getElementById("typewriter-subtitle");

        function animasiKetikSubtitle() {
            if (sedangMenghapus) {
                teksSekarang = teksSubtitle.substring(0, teksSekarang.length - 1);
            } else {
                teksSekarang = teksSubtitle.substring(0, teksSekarang.length + 1);
            }

            elemenSubtitle.innerText = teksSekarang;

            // Memastikan penulisan operator pembagian menggunakan '/' yang valid
            let kecepatan = 100; 
            if (sedangMenghapus) {
                kecepatan = kecepatan / 2; 
            }

            if (!sedangMenghapus && teksSekarang === teksSubtitle) {
                kecepatan = 3000; // Diam 3 detik saat kalimat utuh
                sedangMenghapus = true;
            } else if (sedangMenghapus && teksSekarang === "") {
                sedangMenghapus = false;
                kecepatan = 500; // Jeda sebelum mengetik ulang
            }

            setTimeout(animasiKetikSubtitle, kecepatan);
        }

        // Menjalankan fungsi animasi ketik saat dokumen siap
        document.addEventListener("DOMContentLoaded", animasiKetikSubtitle);
    </script>
</body>
</html>
