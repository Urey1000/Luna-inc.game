<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Puzzle </title>
    <style>
        :root {
            --neon-blue: #00f2fe;
            --neon-purple: #4facfe;
            --neon-glow: rgba(0, 242, 254, 0.5);
            --bg-dark: #0a0b10;
            --glass-bg: rgba(15, 22, 42, 0.45);
            --glass-border: rgba(0, 242, 254, 0.25);
        }

        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: radial-gradient(circle at center, #1a1c29 0%, var(--bg-dark) 100%);
            color: #fff;
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        /* --- TOP NAV BAR (GLASSMORPHISM) --- */
        .navbar {
            width: 100%;
            padding: 15px 40px;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255,255,255,0.1);
        }

        .brand-title {
            font-size: 1.5rem;
            font-weight: 800;
            background: linear-gradient(45deg, var(--neon-blue), var(--neon-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px var(--neon-glow);
            letter-spacing: 1px;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(255, 255, 255, 0.05);
            padding: 6px 16px;
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: linear-gradient(45deg, #ff416c, #ff4b2b);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.9rem;
            box-shadow: 0 0 10px rgba(255,65,108,0.5);
        }

        .user-info .username {
            font-weight: 600;
            font-size: 0.9rem;
            display: block;
        }

        .user-info .user-score {
            font-size: 0.75rem;
            color: var(--neon-blue);
            font-weight: bold;
        }

        .btn-logout {
            background: rgba(255, 75, 75, 0.2);
            border: 1px solid rgba(255, 75, 75, 0.4);
            color: #ff6b6b;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            transition: all 0.3s ease;
        }

        .btn-logout:hover {
            background: #ff4b4b;
            color: #fff;
            box-shadow: 0 0 15px rgba(255, 75, 75, 0.6);
            transform: translateY(-2px);
        }

        /* --- MAIN LAYOUT --- */
        .main-container {
            display: flex;
            width: 1200px;
            max-width: 95%;
            margin: 40px auto;
            gap: 40px;
            align-items: flex-start;
        }

        /* --- GAME PANEL (LEFT) --- */
        .game-panel {
            flex: 1.3;
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
        }

        .game-header {
            text-align: center;
            margin-bottom: 25px;
        }

        .level-badge {
            background: linear-gradient(90deg, var(--neon-blue), var(--neon-purple));
            padding: 6px 18px;
            border-radius: 50px;
            font-weight: bold;
            font-size: 0.9rem;
            letter-spacing: 1px;
            box-shadow: 0 0 15px var(--neon-glow);
            display: inline-block;
            margin-bottom: 10px;
        }

        .difficulty-indicator {
            font-size: 0.85rem;
            color: #aaa;
            margin-top: 5px;
        }

        /* Responsive Dynamic Grid Container */
        #puzzle-container {
            position: relative;
            background-color: rgba(0, 0, 0, 0.4);
            border: 4px solid var(--neon-blue);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(0, 242, 254, 0.2);
            transition: all 0.3s ease;
        }

        .tile {
            position: absolute;
            background-size: 400px 400px; /* Base dimension template */
            user-select: none;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.2s cubic-bezier(0.25, 1, 0.5, 1);
            box-shadow: inset 0 0 4px rgba(255, 255, 255, 0.3);
            border: 1px solid rgba(0,0,0,0.2);
        }

        .tile:hover {
            filter: brightness(1.2);
            box-shadow: 0 0 10px var(--neon-blue);
        }

        .game-controls {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }

        .btn {
            padding: 12px 28px;
            font-size: 0.95rem;
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: none;
        }

        .btn-primary {
            background: transparent;
            border: 2px solid var(--neon-blue);
            color: var(--neon-blue);
            box-shadow: 0 0 10px rgba(0, 242, 254, 0.1);
        }

        .btn-primary:hover {
            background: var(--neon-blue);
            color: #000;
            box-shadow: 0 0 20px var(--neon-glow);
            transform: translateY(-2px);
        }

        /* --- SIDEBAR PANEL (RIGHT) --- */
        .sidebar-panel {
            flex: 0.9;
            display: flex;
            flex-direction: column;
            gap: 30px;
            width: 100%;
        }

        /* Leaderboard Style */
        .panel-box {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 25px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
        }

        .panel-title {
            font-size: 1.2rem;
            font-weight: 700;
            margin-top: 0;
            margin-bottom: 20px;
            border-bottom: 2px solid rgba(255,255,255,0.1);
            padding-bottom: 10px;
            color: var(--neon-blue);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .leaderboard-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .leaderboard-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.03);
            padding: 12px 16px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: transform 0.2s ease;
        }

        .leaderboard-item:hover {
            transform: scale(1.02);
            background: rgba(0, 242, 254, 0.05);
            border-color: rgba(0, 242, 254, 0.2);
        }

        .leaderboard-item.rank-1 {
            border-color: #ffd700;
            background: rgba(255, 215, 0, 0.05);
        }

        .rank-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .rank-number {
            font-weight: 800;
            width: 24px;
            color: #888;
        }

        .rank-1 .rank-number { color: #ffd700; }
        .rank-2 .rank-number { color: #c0c0c0; }
        .rank-3 .rank-number { color: #cd7f32; }

        .rank-name {
            font-weight: 600;
        }

        .rank-score {
            font-weight: 700;
            color: var(--neon-blue);
        }

        .rank-1 .rank-score {
            color: #ffd700;
            text-shadow: 0 0 10px rgba(255,215,0,0.3);
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="brand-title"> PUZZLE </div>
        <div class="nav-right">
            <div class="user-profile">
                <div class="avatar" id="nav-avatar">U</div>
                <div class="user-info">
                    <span class="username" id="nav-username">User_Player</span>
                    <span class="user-score" id="nav-score">Skor: 0</span>
                </div>
            </div>
            <button class="btn-logout" onclick="logoutGame()">Keluar</button>
        </div>
    </nav>

    <main class="main-container">
        
        <section class="game-panel">
            <div class="game-header">
                <div class="level-badge" id="level-display">LEVEL 1</div>
                <div class="difficulty-indicator" id="difficulty-display"> (Mudah)</div>
            </div>

            <div id="puzzle-container"></div>

            <div class="game-controls">
                <button class="btn btn-primary" onclick="shuffleTiles()">Acak Ulang</button>
            </div>
        </section>

        <section class="sidebar-panel">
            
            <div class="panel-box" style="text-align: center;">
                <div class="panel-title">🎯 Panduan Gambar</div>
                <img id="preview-image" src="" alt="Target Preview" style="width: 120px; height: 120px; border-radius: 8px; border: 2px solid rgba(255,255,255,0.2); object-fit: cover;">
                <p style="font-size: 0.8rem; margin-top: 10px; color: #aaa;">Bentuk gambar akhir yang harus Anda susun.</p>
            </div>

            <div class="panel-box">
                <div class="panel-title">🏆 Global Leaderboard</div>
                <div class="leaderboard-list" id="leaderboard-target">
                    </div>
            </div>

        </section>
    </main>

    <script>
        // --- DATA STATE PERMAINAN ---
        let currentUser = {
            username: "#",
            level: 1,
            score: 0
        };

        // Data Pemain Lain untuk Leaderboard Global Fiktif
        let leaderboardData = [
            { username: "AlphaPro", score: 9500 },
            { username: "ShadowMaster", score: 7800 },
            { username: "CyberGamer", score: 6200 },
            { username: "PixelArtisan", score: 4500 }
        ];

        // Konfigurasi Parameter Tingkat Kesulitan Dinamis (100 Level)
        // Level 1-10   : Grid 3x3 (Mudah)
        // Level 11-40  : Grid 4x4 (Sedang)
        // Level 41-100 : Grid 5x5 (Hard/Expert)
        let gridSize = 3; 
        let totalTiles = 9;
        let tiles = [];
        let puzzleWidth = 360; // Ukuran container gameboard tetap (pixel)
        
        // Menggunakan koleksi gambar bertema alam futuristik/hewan yang berubah seiring id level
        function getLevelImageUrl(level) {
            return `https://picsum.photos/id/${(level * 3) + 10}/400/400`;
        }

        // --- INISIALISASI GAME ---
        function initGame() {
            // Update parameter berdasarkan tingkatan level saat ini
            if (currentUser.level <= 10) {
                gridSize = 3;
            } else if (currentUser.level <= 40) {
                gridSize = 4;
            } else {
                gridSize = 5;
            }
            totalTiles = gridSize * gridSize;

            // Generate State Grid yang Berurutan [1, 2, ..., 0]
            tiles = [];
            for (let i = 1; i < totalTiles; i++) {
                tiles.push(i);
            }
            tiles.push(0); // 0 melambangkan ruang grid kosong

            // Sinkronisasi komponen UI Nav & Header
            document.getElementById('nav-username').innerText = currentUser.username;
            document.getElementById('nav-avatar').innerText = currentUser.username.charAt(0).toUpperCase();
            document.getElementById('nav-score').innerText = `Skor: ${currentUser.score}`;
            document.getElementById('level-display').innerText = `LEVEL ${currentUser.level}`;
            
            let diffText = `Ukuran Grid: ${gridSize}x3${gridSize}`;
            if(gridSize === 3) diffText = "Ukuran Grid: 3x3 (Mudah)";
            if(gridSize === 4) diffText = "Ukuran Grid: 4x4 (Normal)";
            if(gridSize === 5) diffText = "Ukuran Grid: 5x5 (Expert)";
            document.getElementById('difficulty-display').innerText = diffText;

            // Set Preview Gambar Kecil
            const imgUrl = getLevelImageUrl(currentUser.level);
            document.getElementById('preview-image').src = imgUrl;

            // Atur Ukuran Box Container Utama secara presisi
            const container = document.getElementById('puzzle-container');
            container.style.width = `${puzzleWidth}px`;
            container.style.height = `${puzzleWidth}px`;

            shuffleTiles();
            updateLeaderboard();
        }

        // --- LOGIKA RENDER PAPAN PUZZLE ---
        function renderPuzzle() {
            const container = document.getElementById('puzzle-container');
            container.innerHTML = '';

            const tileSize = puzzleWidth / gridSize;

            tiles.forEach((tile, index) => {
                if (tile !== 0) {
                    const tileEl = document.createElement('div');
                    tileEl.classList.add('tile');
                    
                    // Set Dimensi Dinamis Kotak
                    tileEl.style.width = `${tileSize - 2}px`; // Dikurangi 2 untuk celah margin halus
                    tileEl.style.height = `${tileSize - 2}px`;

                    // Hitung Koordinat Penempatan Posisi Baris & Kolom saat ini
                    const row = Math.floor(index / gridSize);
                    const col = index % gridSize;
                    tileEl.style.top = `${row * tileSize}px`;
                    tileEl.style.left = `${col * tileSize}px`;

                    // Ambil Potongan Segment Gambar Berdasarkan Identitas 'Tile' Asli
                    tileEl.style.backgroundImage = `url('${getLevelImageUrl(currentUser.level)}')`;
                    tileEl.style.backgroundSize = `${puzzleWidth}px ${puzzleWidth}px`;
                    
                    const originalRow = Math.floor((tile - 1) / gridSize);
                    const originalCol = (tile - 1) % gridSize;
                    tileEl.style.backgroundPosition = `-${originalCol * tileSize}px -${originalRow * tileSize}px`;

                    // Pemicu Klik untuk eksekusi geser
                    tileEl.onclick = () => moveTile(index);
                    container.appendChild(tileEl);
                }
            });
        }

        // --- LOGIKA PERPINDAHAN KOTAK ---
        function moveTile(index) {
            const emptyIndex = tiles.indexOf(0);
            
            const validMoves = [
                emptyIndex - 1,          // Pergeseran Kiri
                emptyIndex + 1,          // Pergeseran Kanan
                emptyIndex - gridSize,   // Pergeseran Atas
                emptyIndex + gridSize    // Pergeseran Bawah
            ];

            const isLeftRightEdge = Math.abs(index - emptyIndex) === 1;
            const isSameRow = Math.floor(index / gridSize) === Math.floor(emptyIndex / gridSize);

            if (validMoves.includes(index) && (!isLeftRightEdge || isSameRow)) {
                // Tukar Posisi nilai array index
                tiles[emptyIndex] = tiles[index];
                tiles[index] = 0;
                
                renderPuzzle();
                checkWin();
            }
        }

        // --- FUNGSI ACAK GENERATOR (SOLVABLE) ---
        function shuffleTiles() {
            // Simulasi pergeseran mundur acak sebanyak 150 kali agar puzzle dijamin valid untuk diselesaikan
            for (let i = 0; i < 150; i++) {
                const emptyIndex = tiles.indexOf(0);
                let validMoves = [];
                
                if (emptyIndex % gridSize > 0) validMoves.push(emptyIndex - 1); 
                if (emptyIndex % gridSize < gridSize - 1) validMoves.push(emptyIndex + 1); 
                if (emptyIndex >= gridSize) validMoves.push(emptyIndex - gridSize);     
                if (emptyIndex < totalTiles - gridSize) validMoves.push(emptyIndex + gridSize); 

                const randomMove = validMoves[Math.floor(Math.random() * validMoves.length)];
                tiles[emptyIndex] = tiles[randomMove];
                tiles[randomMove] = 0;
            }
            renderPuzzle();
        }

        // --- LOGIKA CEK KEMENANGAN & SKOR ---
        function checkWin() {
            // Bikin representasi goal state yang valid
            const winState = [];
            for(let i = 1; i < totalTiles; i++) winState.push(i);
            winState.push(0);

            const isWin = tiles.every((val, i) => val === winState[i]);
            
            if (isWin) {
                setTimeout(() => {
                    currentUser.score += 100; // Logika pertambahan skor +100 poin per level
                    
                    if(currentUser.level >= 100) {
                        alert('🏆 SUNGGUH LUAR BIASA! Anda berhasil menamatkan seluruh 100 Level Odyssey!');
                        currentUser.level = 1;
                        currentUser.score = 0;
                    } else {
                        alert(`🎉 Selamat! Anda Menyelesaikan Level ${currentUser.level}.\nSkor bertambah +100!`);
                        currentUser.level += 1;
                    }
                    
                    initGame();
                }, 200);
            }
        }

        // --- PEMBARUAN DATA LEADERBOARD ---
        function updateLeaderboard() {
            const listContainer = document.getElementById('leaderboard-target');
            listContainer.innerHTML = '';

            // Gabungkan data user saat ini ke dalam ranking global fiktif untuk kalkulasi live rank
            let combinedList = [...leaderboardData];
            // Cek apakah data user sudah ada atau diperbarui
            const existingUserIdx = combinedList.findIndex(p => p.username === currentUser.username);
            if(existingUserIdx !== -1) {
                combinedList[existingUserIdx].score = currentUser.score;
            } else {
                combinedList.push({ username: currentUser.username, score: currentUser.score });
            }

            // Sorting ranking berdasarkan skor terbesar
            combinedList.sort((a, b) => b.score - a.score);

            combinedList.forEach((player, index) => {
                const rankNum = index + 1;
                const item = document.createElement('div');
                item.classList.add('leaderboard-item');
                if(rankNum <= 3) item.classList.add(`rank-${rankNum}`);

                item.innerHTML = `
                    <div class="rank-info">
                        <span class="rank-number">#${rankNum}</span>
                        <span class="rank-name">${player.username} ${player.username === currentUser.username ? '<small style="color:var(--neon-blue)">(Anda)</small>': ''}</span>
                    </div>
                    <span class="rank-score">${player.score} Pts</span>
                `;
                listContainer.appendChild(item);
            });
        }

        // --- FUNGSI KELUAR (LOGOUT TO INDEX) ---
        function logoutGame() {
            if(confirm("Apakah Anda yakin ingin keluar dari permainan? Progres Anda saat ini akan hilang.")) {
                window.location.href = "index.html";
            }
        }

        // Jalankan game otomatis saat load pertama kali
        window.onload = initGame;
    </script>
</body>
</html>
