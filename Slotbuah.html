<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fruit Roulette Game - Premium UI</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #1e003b;
            --secondary: #3b0066;
            --gold: #ffd700;
            --gold-glow: rgba(255, 215, 0, 0.6);
            --text-light: #ffffff;
            --bg-gradient: radial-gradient(circle at 50% 0%, #4a0080 0%, #11001c 80%);
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        body {
            margin: 0;
            padding: 0;
            background: var(--bg-gradient);
            background-attachment: fixed;
            font-family: 'Poppins', sans-serif;
            color: var(--text-light);
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* Top Navigation Bar */
        .top-nav {
            background: rgba(10, 0, 20, 0.8);
            backdrop-filter: blur(10px);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--glass-border);
            position: fixed;
            top: 0;
            width: 100%;
            box-sizing: border-box;
            z-index: 1000;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .nav-title {
            font-weight: 800;
            font-size: 1.2rem;
            color: var(--gold);
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px var(--gold-glow);
        }

        .exit-btn {
            background: linear-gradient(145deg, #ff3333, #cc0000);
            color: white;
            text-decoration: none;
            padding: 8px 25px;
            border-radius: 25px;
            font-weight: 600;
            font-size: 0.9rem;
            box-shadow: 0 4px 0 #880000, 0 5px 10px rgba(255,0,0,0.3);
            transition: all 0.1s ease;
            letter-spacing: 1px;
        }

        .exit-btn:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #880000, 0 2px 5px rgba(255,0,0,0.3);
        }

        /* Game Container */
        .game-container {
            margin-top: 90px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            gap: 25px;
        }

        /* Glassmorphism Panels */
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        /* UI Panel (Saldo & Pesan) */
        .info-panel {
            padding: 20px 40px;
            text-align: center;
            width: 100%;
            max-width: 450px;
            position: relative;
            overflow: hidden;
        }

        /* Dekorasi Glow di dalam panel */
        .info-panel::before {
            content: '';
            position: absolute;
            top: -50%; left: 50%;
            width: 100px; height: 100px;
            background: var(--gold);
            filter: blur(60px);
            transform: translateX(-50%);
            opacity: 0.3;
            z-index: -1;
        }

        .saldo-label {
            font-size: 0.9rem;
            color: #aaa;
            letter-spacing: 2px;
            margin-bottom: 5px;
        }

        #saldo-display {
            font-family: 'Share Tech Mono', monospace;
            font-size: 2.5rem;
            color: var(--gold);
            text-shadow: 0 0 15px var(--gold-glow);
            transition: color 0.3s, transform 0.2s;
        }

        #message {
            margin-top: 15px;
            font-size: 1.1rem;
            color: #00ff88;
            min-height: 28px;
            font-weight: 600;
            background: rgba(0,0,0,0.3);
            padding: 8px 15px;
            border-radius: 10px;
            transition: all 0.3s ease;
        }

        /* Roulette Wheel */
        .roulette-wrapper {
            position: relative;
            margin: 10px 0 20px;
            padding: 20px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.2);
            box-shadow: inset 0 0 30px rgba(0,0,0,0.8), 0 0 20px rgba(100,0,200,0.3);
        }

        .pointer {
            position: absolute;
            top: -5px;
            left: 50%;
            transform: translateX(-50%);
            width: 40px; 
            height: 50px; 
            background: linear-gradient(135deg, #ff0055, #aa0033);
            clip-path: polygon(50% 100%, 0 0, 100% 0);
            z-index: 10;
            filter: drop-shadow(0 5px 5px rgba(0,0,0,0.6));
        }

        /* Outer ring styling for Casino look */
        .wheel-border {
            border-radius: 50%;
            padding: 10px;
            background: linear-gradient(45deg, #111, #333);
            box-shadow: 0 0 15px var(--gold-glow), inset 0 0 10px black;
        }

        .wheel {
            width: 320px;
            height: 320px;
            border-radius: 50%;
            border: 6px solid var(--gold);
            background: repeating-conic-gradient(
                from 0deg,
                #990033 0deg 45deg,
                #cc5200 45deg 90deg,
                #cca300 90deg 135deg,
                #009933 135deg 180deg,
                #0066cc 180deg 225deg,
                #6600cc 225deg 270deg,
                #cc0099 270deg 315deg,
                #1a1a1a 315deg 360deg
            );
            box-shadow: inset 0 0 40px rgba(0,0,0,0.9);
            position: relative;
            transition: transform 3s cubic-bezier(0.25, 0.1, 0.15, 1); /* Smoother spin curve */
        }

        .wheel-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 70px;
            height: 70px;
            background: radial-gradient(circle at 30% 30%, #fffbdd, var(--gold), #b38f00);
            border-radius: 50%;
            z-index: 5;
            box-shadow: 0 5px 15px rgba(0,0,0,0.6), inset 0 -3px 5px rgba(0,0,0,0.3);
            border: 3px solid #ffe680;
        }

        .segment-img {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 55px;
            height: 55px;
            margin-top: -27.5px;
            margin-left: -27.5px;
            transform-origin: 50% 50%;
            z-index: 2;
            filter: drop-shadow(2px 2px 3px rgba(0,0,0,0.8));
        }

        /* Controls Panel */
        .controls {
            display: flex;
            flex-direction: column;
            gap: 25px;
            padding: 25px 30px;
            width: 100%;
            max-width: 450px;
            box-sizing: border-box;
        }

        .bet-section {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .bet-section label {
            text-align: center; 
            color: #aaa; 
            font-size: 0.9rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .bet-buttons {
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }

        .bet-btn {
            flex: 1;
            background: linear-gradient(145deg, #3a0088, #220055);
            color: #ccc;
            border: 1px solid #5522aa;
            padding: 12px 0;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 800;
            font-size: 1rem;
            box-shadow: 0 4px 0 #110022, 0 5px 10px rgba(0,0,0,0.3);
            transition: all 0.1s ease;
            font-family: 'Poppins', sans-serif;
        }

        .bet-btn:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #110022, 0 2px 5px rgba(0,0,0,0.3);
        }

        .bet-btn.active {
            background: linear-gradient(145deg, #ffe600, #ccb800);
            color: #1a0033;
            border: 1px solid #fff;
            box-shadow: 0 4px 0 #998a00, 0 5px 15px var(--gold-glow);
        }

        .spin-actions {
            display: flex;
            gap: 15px;
            align-items: stretch;
            height: 65px;
        }

        .btn-spin {
            flex: 2;
            background: linear-gradient(145deg, #00e676, #00b359);
            border: none;
            color: #003311;
            font-size: 1.5rem;
            font-weight: 800;
            border-radius: 15px;
            cursor: pointer;
            box-shadow: 0 6px 0 #008040, 0 10px 20px rgba(0, 255, 118, 0.4);
            transition: all 0.1s ease;
            font-family: 'Poppins', sans-serif;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        
        .btn-spin:active:not(:disabled) {
            transform: translateY(6px);
            box-shadow: 0 0 0 #008040, 0 2px 10px rgba(0, 255, 118, 0.4);
        }

        .btn-spin:disabled {
            background: linear-gradient(145deg, #555, #333);
            color: #888;
            box-shadow: 0 6px 0 #111;
            cursor: not-allowed;
        }

        .btn-spin:disabled:active {
            transform: none;
        }

        .btn-autospin {
            flex: 1;
            background: linear-gradient(145deg, #ff9900, #cc7a00);
            border: none;
            color: #331a00;
            font-weight: 800;
            font-size: 0.9rem;
            border-radius: 15px;
            cursor: pointer;
            box-shadow: 0 6px 0 #995c00, 0 8px 15px rgba(255, 153, 0, 0.3);
            transition: all 0.1s ease;
            font-family: 'Poppins', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            line-height: 1.2;
        }

        .btn-autospin:active {
            transform: translateY(6px);
            box-shadow: 0 0 0 #995c00, 0 2px 5px rgba(255, 153, 0, 0.3);
        }

        .btn-autospin.on {
            background: linear-gradient(145deg, #ff0055, #cc0044);
            color: white;
            box-shadow: 0 6px 0 #88002d, 0 10px 20px rgba(255, 0, 85, 0.4);
        }
        
        .btn-autospin.on:active {
            box-shadow: 0 0 0 #88002d, 0 2px 5px rgba(255, 0, 85, 0.4);
        }

        /* Responsiveness for smaller screens */
        @media (max-width: 400px) {
            .wheel, .wheel-border {
                width: 280px;
                height: 280px;
            }
            #saldo-display { font-size: 2rem; }
            .bet-buttons { flex-wrap: wrap; }
            .bet-btn { min-width: 30%; }
        }
    </style>
</head>
<body>

    <nav class="top-nav">
        <div class="nav-title">Fruit Roulette</div>
        <a href="index.html" class="exit-btn">KELUAR</a>
    </nav>

    <div class="game-container">
        
        <div class="glass-panel info-panel">
            <div class="saldo-label">TOTAL SALDO</div>
            <div id="saldo-display">Rp 1.000.000</div>
            <div id="message">Pilih taruhan & Putar Roda!</div>
        </div>

        <div class="roulette-wrapper">
            <div class="pointer"></div>
            <div class="wheel-border">
                <div class="wheel" id="wheel">
                    <div class="wheel-center"></div>
                </div>
            </div>
        </div>

        <div class="glass-panel controls">
            <div class="bet-section">
                <label>Pilih Nilai Taruhan</label>
                <div class="bet-buttons" id="bet-buttons">
                    <button class="bet-btn active" data-bet="20">20</button>
                    <button class="bet-btn" data-bet="40">40</button>
                    <button class="bet-btn" data-bet="60">60</button>
                    <button class="bet-btn" data-bet="80">80</button>
                    <button class="bet-btn" data-bet="100">100</button>
                </div>
            </div>

            <div class="spin-actions">
                <button class="btn-spin" id="spin-btn">SPIN</button>
                <button class="btn-autospin" id="auto-spin-btn">
                    <span>AUTO</span>
                    <span id="auto-status" style="font-size: 0.75rem; opacity: 0.8;">OFF</span>
                </button>
            </div>
        </div>

    </div>

    <audio id="audio-spin" src="Play.mp3" preload="auto"></audio>
    <audio id="audio-freespin" src="b.mp3" preload="auto"></audio>
    <audio id="audio-bomb" src="bomb.mp3" preload="auto"></audio>

    <script>
        // --- DATA GAME ---
        const fruits = [
            { name: 'Semangka',  img: 'R2.png', multiplier: 2, isBomb: false },
            { name: 'Jeruk',     img: 'R1.png', multiplier: 3, isBomb: false },
            { name: 'Salak',     img: 'R5.png', multiplier: 5, isBomb: false },
            { name: 'Free Spin', img: 'F0.png', multiplier: 0, isFreeSpin: true, isBomb: false },
            { name: 'Pisang',    img: 'R3.png', multiplier: 10, isBomb: false },
            { name: 'Ceri',      img: 'R4.png', multiplier: 1.5, isBomb: false },
            { name: 'Nanas',     img: 'R6.png', multiplier: 4, isBomb: false },
            { name: 'Bom Minus', img: 'D0.png', multiplier: 0, isBomb: true, penalty: 10000 }
        ];

        // --- STATE GAME ---
        let saldo = 1000000;
        let currentBet = 20;
        let isSpinning = false;
        let isAutoSpin = false;
        let currentRotation = 0;
        let freeSpinsCount = 0;

        // --- ELEMEN DOM ---
        const saldoDisplay = document.getElementById('saldo-display');
        const messageDisplay = document.getElementById('message');
        const wheel = document.getElementById('wheel');
        const spinBtn = document.getElementById('spin-btn');
        const autoSpinBtn = document.getElementById('auto-spin-btn');
        const autoStatusText = document.getElementById('auto-status');
        const betButtons = document.querySelectorAll('.bet-btn');
        
        // Elemen Suara
        const soundSpin = document.getElementById('audio-spin');
        const soundFreeSpin = document.getElementById('audio-freespin');
        const soundBomb = document.getElementById('audio-bomb');

        // Format angka ke Rupiah
        const formatRp = (angka) => {
            return 'Rp ' + angka.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".");
        }

        // --- INISIALISASI ROULETTE ---
        function initWheel() {
            const totalSegments = fruits.length;
            const anglePerSegment = 360 / totalSegments;

            fruits.forEach((fruit, index) => {
                const img = document.createElement('img');
                img.src = fruit.img;
                img.className = 'segment-img';
                
                const angle = index * anglePerSegment;
                img.style.transform = `rotate(${angle}deg) translateY(-110px) rotate(${-angle}deg)`;
                
                wheel.appendChild(img);
            });
        }

        // --- LOGIKA TARUHAN ---
        betButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                if (isSpinning) return; 
                
                betButtons.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                
                currentBet = parseInt(btn.getAttribute('data-bet'));
                messageDisplay.innerText = `Taruhan: ${currentBet} poin.`;
                messageDisplay.style.color = '#fff';
            });
        });

        // --- LOGIKA SPIN ---
        function performSpin() {
            if (isSpinning) return;

            // Efek interaksi UI
            saldoDisplay.style.transform = "scale(0.95)";
            setTimeout(() => saldoDisplay.style.transform = "scale(1)", 150);

            if (saldo <= 0 || (saldo < currentBet && freeSpinsCount === 0)) {
                messageDisplay.innerText = "Saldo tidak cukup!";
                messageDisplay.style.color = "#ff4b4b";
                isAutoSpin = false;
                updateAutoSpinUI();
                return;
            }

            if (freeSpinsCount > 0) {
                freeSpinsCount--;
                messageDisplay.innerText = `FREE SPIN DIGUNAKAN! (Sisa: ${freeSpinsCount})`;
                messageDisplay.style.color = "#ffd700";
            } else {
                saldo -= currentBet;
                saldoDisplay.innerText = formatRp(saldo);
                messageDisplay.innerText = "Roda berputar...";
                messageDisplay.style.color = "#fff";
            }

            isSpinning = true;
            spinBtn.disabled = true;

            soundSpin.currentTime = 0;
            soundSpin.play().catch(e => console.log("Audio diblokir browser."));

            const totalSegments = fruits.length;
            const winnerIndex = Math.floor(Math.random() * totalSegments);
            const segmentAngle = 360 / totalSegments;

            const spins = 5;
            const targetAngle = 360 - (winnerIndex * segmentAngle);
            const totalRotationNeeded = (spins * 360) + targetAngle;
            
            currentRotation += totalRotationNeeded - (currentRotation % 360);
            wheel.style.transform = `rotate(${currentRotation}deg)`;

            setTimeout(() => {
                isSpinning = false;
                spinBtn.disabled = false;
                
                soundSpin.pause();
                handleWin(fruits[winnerIndex]);

                if (isAutoSpin) {
                    setTimeout(performSpin, 1200);
                }
            }, 3000);
        }

        // --- LOGIKA KEMENANGAN & PENALTI ---
        function handleWin(winner) {
            saldoDisplay.style.color = "var(--gold)";

            if (winner.isBomb) {
                saldo -= winner.penalty;
                if(saldo < 0) saldo = 0; 
                
                saldoDisplay.innerText = formatRp(saldo);
                saldoDisplay.style.color = "#ff4b4b";
                messageDisplay.innerText = `💥 KABOOM! Poin dikurangi ${winner.penalty}!`;
                messageDisplay.style.color = "#ff4b4b";

                soundBomb.currentTime = 0;
                soundBomb.play().catch(e => console.log(e));

                if(saldo === 0) {
                    isAutoSpin = false;
                    updateAutoSpinUI();
                }

            } else if (winner.isFreeSpin) {
                freeSpinsCount++;
                messageDisplay.innerText = "✨ SELAMAT! Dapat 1 FREE SPIN! ✨";
                messageDisplay.style.color = "#ffd700";

                soundFreeSpin.currentTime = 0;
                soundFreeSpin.play().catch(e => console.log(e));

            } else {
                const winnings = currentBet * winner.multiplier;
                saldo += winnings;
                saldoDisplay.innerText = formatRp(saldo);
                
                if (winnings > 0) {
                    messageDisplay.innerText = `🎉 MENANG! +${winnings} dari ${winner.name}`;
                    messageDisplay.style.color = "#00ff88";
                } else {
                    messageDisplay.innerText = "Coba lagi!";
                    messageDisplay.style.color = "#aaa";
                }
            }
        }

        // --- LOGIKA AUTO SPIN ---
        function updateAutoSpinUI() {
            if (isAutoSpin) {
                autoStatusText.innerText = "ON";
                autoSpinBtn.classList.add('on');
            } else {
                autoStatusText.innerText = "OFF";
                autoSpinBtn.classList.remove('on');
            }
        }

        autoSpinBtn.addEventListener('click', () => {
            isAutoSpin = !isAutoSpin;
            updateAutoSpinUI();
            
            if (isAutoSpin && !isSpinning) {
                performSpin();
            }
        });

        spinBtn.addEventListener('click', () => {
            if (isAutoSpin) {
                isAutoSpin = false;
                updateAutoSpinUI();
            }
            performSpin();
        });

        initWheel();
    </script>
</body>
</html>
